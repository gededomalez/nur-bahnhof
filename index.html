<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KI-Kurs Nur Bahnhof</title>
<style>
/* Schriften liegen neben dieser Datei, damit beim Laden keine Daten an Dritte gehen */
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:normal;font-display:swap;src:url("atkinson-hyperlegible-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:normal;font-display:swap;src:url("atkinson-hyperlegible-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-style:normal;font-display:swap;src:url("barlow-condensed-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-style:normal;font-display:swap;src:url("barlow-condensed-latin-700-normal.woff2") format("woff2")}
:root{
  /* Layout: eine schmale Spalte wie ein Aushangfahrplan. Die gelbe Tafel trägt Titel und Fahrplan,
     alles andere ist ruhiges Papier. Rückmeldungen sind Signale: Grün heißt Fahrt, Rot heißt Halt. */
  --tafel:#FFD400;
  --tafel-schrift:#101C3A;
  --papier:#F7F7F1;
  --karte:#FFFFFF;
  --tinte:#101C3A;
  --tinte-leise:#4A546B;
  --linie:#D5D6CB;
  --gleis:#0B4EA2;
  --gleis-schrift:#FFFFFF;
  --fahrt:#0A7A3E;
  --halt:#BF2A1C;
  --vorsicht:#8A5200;
  --fahrt-flaeche:#E3F3E9;
  --halt-flaeche:#FBE8E5;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --text:"Atkinson Hyperlegible",Verdana,Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --tafel:#131E36;
    --tafel-schrift:#FFD400;
    --papier:#0A1120;
    --karte:#121B30;
    --tinte:#EEF0F5;
    --tinte-leise:#A9B2C6;
    --linie:#2B3754;
    --gleis:#8FBCFF;
    --gleis-schrift:#0A1120;
    --fahrt:#57D595;
    --halt:#FF8C7C;
    --vorsicht:#FFC56B;
    --fahrt-flaeche:#0E2A1E;
    --halt-flaeche:#33171A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --tafel:#131E36;
  --tafel-schrift:#FFD400;
  --papier:#0A1120;
  --karte:#121B30;
  --tinte:#EEF0F5;
  --tinte-leise:#A9B2C6;
  --linie:#2B3754;
  --gleis:#8FBCFF;
  --gleis-schrift:#0A1120;
  --fahrt:#57D595;
  --halt:#FF8C7C;
  --vorsicht:#FFC56B;
  --fahrt-flaeche:#0E2A1E;
  --halt-flaeche:#33171A;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--papier);
  color:var(--tinte);
  font-family:var(--text);
  font-size:1.0625rem;
  line-height:1.55;
  -webkit-text-size-adjust:100%;
}
#app{max-width:35rem;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:3.1rem;letter-spacing:-0.01em}
h2{font-size:1.95rem}
h3{font-size:1.35rem;font-weight:600}
p{margin:0}
a{color:var(--gleis)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gleis);outline-offset:2px}
.tafel :focus-visible{outline-color:var(--tafel-schrift)}

/* Tafel */
.tafel{background:var(--tafel);color:var(--tafel-schrift);padding:1.75rem 1.25rem 1.25rem;display:flex;flex-direction:column;gap:1.1rem}
.tafel-text{font-size:1.125rem;max-width:30ch}
.stand{display:flex;flex-direction:column;gap:.45rem}
.strecke{display:flex;align-items:center}
.strecke i{width:.95rem;height:.95rem;border-radius:50%;border:2.5px solid var(--tafel-schrift);flex:none;transition:background-color .4s}
.strecke i.voll{background:var(--tafel-schrift)}
.strecke b{flex:1;height:2.5px;background:var(--tafel-schrift)}
.stand p{font-size:.95rem}
.knopf{
  background:var(--gleis);color:var(--gleis-schrift);border:0;border-radius:.45rem;
  padding:.85rem 1.2rem;font-weight:700;font-size:1.0625rem;min-height:3rem;text-align:center;
}
.knopf[disabled]{opacity:.42;cursor:not-allowed}
.tafel .knopf{background:var(--tafel-schrift);color:var(--tafel);align-self:flex-start}
.knopf.leise{background:transparent;color:var(--gleis);border:2px solid var(--gleis);font-size:1.0625rem}

.fahrplan-kopf{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid var(--tafel-schrift);padding-bottom:.3rem;margin-top:.5rem}
.fahrplan-kopf span{font-size:.9rem}
.fahrplan{list-style:none;margin:0;padding:0}
.fahrplan li{border-bottom:1.5px solid var(--tafel-schrift)}
.zeile{
  display:grid;grid-template-columns:auto 1fr auto;gap:.85rem;align-items:center;width:100%;
  background:none;border:0;padding:.8rem 0;text-align:left;color:inherit;
}
.nr{
  font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1;
  width:2.3rem;height:2.3rem;display:grid;place-items:center;
  background:var(--tafel-schrift);color:var(--tafel);border-radius:.25rem;
}
.thema{display:flex;flex-direction:column;min-width:0}
.thema b{font-family:var(--display);font-weight:600;font-size:1.4rem;line-height:1.1}
.thema span{font-size:.9rem;opacity:.85}
.rand{display:flex;flex-direction:column;align-items:flex-end;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.rand .erledigt{font-weight:700}
.zeile.naechster .thema b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

/* Papier-Bereiche */
.seite{padding:1.5rem 1.25rem 2rem;display:flex;flex-direction:column;gap:1.25rem;flex:1}
.kasten{background:var(--karte);border:1.5px solid var(--linie);border-radius:.6rem;padding:1.1rem 1.15rem;display:flex;flex-direction:column;gap:.6rem}
.leise{color:var(--tinte-leise);font-size:.95rem}

/* Fahrkarte */
.fahrkarte{
  background:var(--karte);border:2px solid var(--tinte);border-radius:.6rem;padding:1.1rem 1.15rem;
  display:flex;flex-direction:column;gap:.9rem;position:relative;
}
.fahrkarte-kopf{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;border-bottom:2px dashed var(--tinte);padding-bottom:.7rem}
.fahrkarte-zahl{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.frage-zeile{display:flex;flex-direction:column;gap:.45rem}
.wahl{display:flex;flex-wrap:wrap;gap:.45rem}
.wahl button{
  background:var(--karte);border:2px solid var(--linie);border-radius:.45rem;padding:.5rem .85rem;min-width:2.9rem;min-height:2.75rem;
}
.wahl button[aria-pressed="true"]{border-color:var(--gleis);background:var(--gleis);color:var(--gleis-schrift);font-weight:700}
.kopie{background:var(--papier);border:1.5px dashed var(--linie);border-radius:.45rem;padding:.7rem .8rem;font-size:.95rem;user-select:all;overflow-wrap:anywhere}

/* Navigation */
.nav{
  position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,auto);
  background:var(--karte);border-top:1.5px solid var(--linie);
}
.nav a{
  padding:.85rem .35rem;text-align:center;text-decoration:none;color:var(--tinte-leise);
  font-family:var(--display);font-weight:600;font-size:1.2rem;border-top:4px solid transparent;margin-top:-1.5px;
}
.nav a[aria-current="page"]{color:var(--tinte);border-top-color:var(--tafel)}

/* Lektion */
.lektion{display:flex;flex-direction:column;flex:1;min-height:100vh}
.kopf{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.75rem 1.25rem;background:var(--tafel);color:var(--tafel-schrift)}
.kopf button{background:none;border:0;padding:.4rem 0;font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:2.75rem}
.kopf span{font-family:var(--display);font-weight:600;font-size:1.25rem}
.schritte{display:flex;gap:4px;padding:0 1.25rem;background:var(--tafel);padding-bottom:.75rem}
.schritte i{flex:1;height:5px;background:var(--tafel-schrift);opacity:.25;border-radius:2px}
.schritte i.war{opacity:1}
.blatt{flex:1;padding:1.6rem 1.25rem 1.5rem;display:flex;flex-direction:column;gap:1rem}
.blatt p,.blatt li{max-width:62ch}
.blatt ul{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.45rem}
.fuss{position:sticky;bottom:0;background:var(--papier);border-top:1.5px solid var(--linie);padding:.8rem 1.25rem;display:flex}
.fuss .knopf{flex:1}
.fuss.zwei{flex-direction:column;gap:.5rem}
.kennung{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.merke{border-left:6px solid var(--tafel);background:var(--karte);padding:.8rem 1rem;border-radius:0 .45rem .45rem 0;font-weight:700}
.quelle{font-size:.9rem;color:var(--tinte-leise)}
.zaehler{font-size:.95rem;color:var(--tinte-leise);font-variant-numeric:tabular-nums}

.optionen{display:flex;flex-direction:column;gap:.6rem}
.option{
  background:var(--karte);border:2px solid var(--linie);border-radius:.5rem;padding:.8rem 1rem;text-align:left;min-height:3.2rem;
  display:flex;gap:.7rem;align-items:flex-start;
}
.option:not([disabled]):hover{border-color:var(--gleis)}
.option[disabled]{cursor:default}
.option.richtig{border-color:var(--fahrt);background:var(--fahrt-flaeche)}
.option.falsch{border-color:var(--halt);background:var(--halt-flaeche)}
.option .zeichen{font-weight:700;flex:none;width:1.1rem}
.option.richtig .zeichen{color:var(--fahrt)}
.option.falsch .zeichen{color:var(--halt)}

.aussage{
  background:var(--karte);border:2px solid var(--tinte);border-radius:.6rem;padding:1.4rem 1.1rem;
  font-family:var(--display);font-weight:600;font-size:1.7rem;line-height:1.15;text-wrap:balance;
}
.eimer{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fit,minmax(5.8rem,1fr))}
.eimer .option{justify-content:center;align-items:center;text-align:center;font-weight:700;padding:.8rem .4rem}

.rueck{border-radius:.5rem;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.45rem;border:2px solid}
.rueck.gut{border-color:var(--fahrt);background:var(--fahrt-flaeche)}
.rueck.schlecht{border-color:var(--halt);background:var(--halt-flaeche)}
.rueck-kopf{display:flex;align-items:center;gap:.55rem;font-weight:700}
.lampe{width:.95rem;height:.95rem;border-radius:50%;flex:none}
.gut .lampe{background:var(--fahrt)}
.schlecht .lampe{background:var(--halt)}

.satz{font-family:var(--display);font-weight:600;font-size:1.75rem;line-height:1.2;background:var(--karte);border:2px solid var(--tinte);border-radius:.6rem;padding:1.1rem}
.luecke{display:inline-block;min-width:3.5ch;border-bottom:3px solid var(--gleis);color:var(--gleis)}
.balken{display:flex;flex-direction:column;gap:.5rem}
.balken-zeile{display:grid;grid-template-columns:6.2rem 1fr 4.2rem;gap:.6rem;align-items:center;font-variant-numeric:tabular-nums}
.balken-bahn{height:1rem;background:var(--linie);border-radius:.25rem;overflow:hidden}
.balken-bahn i{display:block;height:100%;background:var(--gleis);border-radius:.25rem}
.balken-zeile.treffer .balken-bahn i{background:var(--fahrt)}
.balken-zeile span:last-child{text-align:right}

.eingabe{width:100%;font:inherit;color:var(--tinte);background:var(--karte);border:2px solid var(--linie);border-radius:.5rem;padding:.75rem .9rem;resize:vertical}
.tokens{display:flex;flex-wrap:wrap;gap:.3rem}
.tokens span{background:var(--karte);border:1.5px solid var(--gleis);border-radius:.3rem;padding:.1rem .4rem;font-size:1rem}
.tokens span:nth-child(even){background:var(--tafel);color:#101C3A;border-color:#101C3A}
.bausteine{display:flex;flex-wrap:wrap;gap:.5rem}
.baustein{background:var(--karte);border:2px solid var(--linie);border-radius:2rem;padding:.5rem 1rem;min-height:2.75rem;font-weight:700}
.baustein[aria-pressed="true"]{background:var(--gleis);color:var(--gleis-schrift);border-color:var(--gleis)}
.prompt{background:var(--karte);border:2px solid var(--tinte);border-radius:.6rem;padding:1rem 1.1rem;font-size:1.1rem}
.prompt mark{background:var(--tafel);color:#101C3A;padding:0 .15rem;border-radius:.15rem}

.glossar{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.glossar li{padding:.85rem 0;border-bottom:1.5px solid var(--linie);display:flex;flex-direction:column;gap:.2rem}
.quellen{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.8rem}
.quellen li{overflow-wrap:anywhere}
.quellen small{display:block;color:var(--tinte-leise);font-size:.9rem}

@media (min-width:36rem){
  h1{font-size:3.8rem}
  #app{box-shadow:0 0 0 1.5px var(--linie)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- Einstellungen: vor dem Teilen ausfüllen ---------- */
const KONFIG = {
  messUrl: "",                 // Web-App-Adresse des Google-Skripts, endet auf /exec. Leer heißt: es wird nichts gezählt.
  version: "0.3",
  loeschfrist: "bis zum Ende der Testphase, längstens zwölf Monate",
  betreiber: { name: "", anschrift: "", mail: "" }   // Angaben für Impressum und Datenschutzhinweis

/* ---------- Quellen ---------- */
const Q = {
  bitkom:{kurz:"Bitkom-Umfrage 2026", titel:"Bitkom-Umfrage zur KI-Nutzung in Deutschland, über 1.000 Befragte ab 16 Jahren", wer:"Bericht bei retail-news.de, 2026", url:"https://retail-news.de/bitkom-ki-umfrage-deutschland-alltag-vorbehalte/"},
  tokens:{kurz:"OpenAI Help Center", titel:"What are tokens and how to count them?", wer:"OpenAI Help Center, abgerufen im November 2026", url:"https://help.openai.com/en/articles/4936856-what-are-tokens-and-how-to-count-them"},
  ebu:{kurz:"EBU/BBC-Studie 2025", titel:"News Integrity in AI Assistants. An international PSM study", wer:"European Broadcasting Union und BBC, Oktober 2025", url:"https://www.ebu.ch/Report/MIS-BBC/NI_AI_2025.pdf"},

  prompt:{kurz:"Anthropic-Dokumentation", titel:"Prompt engineering overview", wer:"Anthropic, abgerufen im November 2026", url:"https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/overview"},
  bsi:{kurz:"BSI zu Deepfakes", titel:"Deepfakes – Gefahren und Gegenmaßnahmen", wer:"Bundesamt für Sicherheit in der Informationstechnik", url:"https://www.bsi.bund.de/DE/Themen/Unternehmen-und-Organisationen/Informationen-und-Empfehlungen/Kuenstliche-Intelligenz/Deepfakes/deepfakes_node.html"},
  art50:{kurz:"DQS zu Artikel 50 der KI-Verordnung", titel:"KI-Kennzeichnungspflicht nach dem EU AI Act", wer:"DQS, 2026. Gesetzestext: Verordnung (EU) 2024/1689, Artikel 50", url:"https://www.dqsglobal.com/de/entdecken/blog/ki-kennzeichnungspflicht-eu-ai-act"},
  wasser:{kurz:"ORF zu Googles Messung", titel:"Google: KI-Anfrage braucht Strom wie neun Sekunden TV", wer:"ORF, August 2025", url:"https://orf.at/stories/3403199"},
  wasser2:{kurz:"ingenieur.de", titel:"Wie viel Strom und Wasser braucht ChatGPT?", wer:"ingenieur.de, mit den Angaben von OpenAI", url:"https://www.ingenieur.de/?p=10662"},
  strom:{kurz:"cleanthinking.de", titel:"Google, Mistral und Epoch AI beziffern den Strom einer KI-Antwort", wer:"cleanthinking.de, 2026, mit Zahlen der Internationalen Energieagentur", url:"https://cleanthinking.de/sprachmodell"},
  shades:{kurz:"Gender Shades (2018)", titel:"Gender Shades: Intersectional Accuracy Disparities in Commercial Gender Classification", wer:"Joy Buolamwini und Timnit Gebru, Proceedings of Machine Learning Research 81, 2018", url:"https://proceedings.mlr.press/v81/buolamwini18a.html"},
  wef:{kurz:"WEF Future of Jobs 2025", titel:"Future of Jobs Report 2025, Pressemitteilung", wer:"World Economic Forum, Januar 2025", url:"https://www.weforum.org/press/2025/01/future-of-jobs-report-2025-78-million-new-job-opportunities-by-2030-but-urgent-upskilling-needed-to-prepare-workforces/"},
  curriculum:{kurz:"KI-Basiscurriculum", titel:"KI-Basiscurriculum, Endbericht", wer:"Universität für Weiterbildung Krems im Auftrag des OeAD, November 2025", url:"https://digitalekompetenzen.oead.at/fileadmin/Dokumente/oead.at/Bildung_Digital/Digitale_Kompetenzen/GSDK/KI_Basiscurriculum_Endbericht.pdf"}
};

/* ---------- Inhalte ---------- */
const HALTE = [
{
  id:"h1", titel:"Was ist KI überhaupt?", kurz:"Wo KI längst drinsteckt", dauer:4,
  mitnehmen:["KI ist Software, die Muster aus Beispielen gelernt hat.","Sie steckt längst im Alltag, etwa im Spamfilter oder im Navi.","Chatbots wie ChatGPT sind eine Art von KI: Sprachmodelle, die Text erzeugen."],
  schritte:[
    {typ:"text", h:"Du bist nicht allein", html:"<p>Rund 4 von 10 Menschen in Deutschland sagen, dass sie sich bei KI abgehängt fühlen. Wenn du bei dem Thema nur Bahnhof verstehst, bist du in guter Gesellschaft.</p><p>Dieser Kurs erklärt die Grundlagen in sechs kurzen Etappen. Du brauchst kein Vorwissen und musst nichts installieren.</p>", quelle:["bitkom"]},
    {typ:"text", h:"KI ist kein Roboter", html:"<p>Künstliche Intelligenz, kurz KI, ist Software. Sie erledigt Aufgaben, für die man früher einen Menschen brauchte: Sprache verstehen, Bilder erkennen, Vorhersagen treffen.</p><p>Der Unterschied zu einem normalen Programm: Ein normales Programm folgt festen Regeln, die jemand hineingeschrieben hat. Ein KI-System hat seine Regeln selbst aus sehr vielen Beispielen gelernt.</p>", merke:"KI lernt Muster aus Beispielen. Niemand hat ihr jede Regel einzeln beigebracht."},
    {typ:"sortieren", h:"Steckt hier KI drin?", eimer:["Ja, KI","Nein, keine KI"], karten:[
      {t:"Der Spamfilter in deinem E-Mail-Postfach", e:0, warum:"Er hat an sehr vielen Mails gelernt, wie Werbung und Betrug aussehen."},
      {t:"Ein Taschenrechner", e:1, warum:"Er rechnet nach festen Regeln. Gelernt hat er nichts."},
      {t:"Die Stauprognose im Navi", e:0, warum:"Sie schätzt aus früheren Verkehrsdaten, wie voll die Straße gleich sein wird."},
      {t:"Eine Zeitschaltuhr an der Lampe", e:1, warum:"Sie schaltet zur eingestellten Uhrzeit. Das ist eine feste Regel."},
      {t:"Dein Handy entsperrt sich, wenn es dein Gesicht sieht", e:0, warum:"Das Gerät hat an Bildern gelernt, Gesichter zu unterscheiden."},
      {t:"Film-Vorschläge beim Streaming", e:0, warum:"Das System lernt aus dem, was du und andere geschaut haben."}
    ]},
    {typ:"quiz", frage:"Seit wann gibt es den Begriff „Künstliche Intelligenz“?", optionen:["1956","1989","2007","2022"], richtig:0, warum:"Der Begriff stammt von einer Forschertagung im Jahr 1956 in den USA. Neu ist seit Ende 2022 nur, dass mit ChatGPT jeder so ein System selbst ausprobieren kann."},
    {typ:"text", h:"Was an ChatGPT und Co. neu ist", html:"<p>Die meisten KI-Systeme sortieren etwas oder sagen etwas vorher. Generative KI erzeugt etwas Neues: Texte, Bilder, Musik, Videos.</p><p>ChatGPT, Gemini, Copilot oder Claude sind Chatbots. In ihnen steckt ein Sprachmodell, das auf Text spezialisiert ist. Wie das arbeitet, siehst du am nächsten Halt.</p>"},
    {typ:"quiz", frage:"Was unterscheidet ein KI-System von einem normalen Programm?", optionen:["Es hat seine Regeln aus Beispielen gelernt","Es läuft nur auf besonders schnellen Computern","Es hat ein eigenes Bewusstsein","Es ist immer mit dem Internet verbunden"], richtig:0, warum:"Das Lernen aus Beispielen ist der Kern. Schnelle Rechner helfen dabei, sind aber nicht der Unterschied. Ein Bewusstsein hat keines dieser Systeme nachweislich."}
  ]
},
{
  id:"h2", titel:"Wie ein Sprachmodell tickt", kurz:"Tokens und das nächste Wort", dauer:5,
  mitnehmen:["Ein Sprachmodell berechnet, welches Textstück wahrscheinlich als nächstes kommt.","Wahrscheinlich ist nicht dasselbe wie wahr.","Tokens sind die Häppchen, in denen das Modell rechnet und in denen seine Grenzen gemessen werden."],
  schritte:[
    {typ:"text", h:"Ein Sprachmodell rät das nächste Textstück", html:"<p>Ein Sprachmodell hat sehr viel Text verarbeitet: Bücher, Webseiten, Foren. Dabei hat es gelernt, welche Textstücke häufig aufeinander folgen.</p><p>Wenn du etwas fragst, berechnet es Stück für Stück, wie der Text wahrscheinlich weitergeht. Mehr passiert im Kern nicht. Das klingt simpel, reicht aber für erstaunlich brauchbare Antworten.</p>"},

const SPEICHER = "nurbahnhof-v1";

function laden(){ try{ return JSON.parse(localStorage.getItem(SPEICHER)) || {}; }catch(e){ return {}; } }
function sichern(){ try{ localStorage.setItem(SPEICHER, JSON.stringify(fort)); }catch(e){} }
let fort = Object.assign({erledigt:{}, tage:0, letzterTag:null, rueck:{}, zaehlen:null, id:null, q:"", gemeldet:{}}, laden());

/* ---------- Messung: nur mit Einwilligung und nur, wenn eine Adresse eingetragen ist ---------- */
const QUELLE = (() => { try{ return (new URLSearchParams(location.search).get("q") || "").replace(/[^a-z0-9-]/gi, "").slice(0, 24).toLowerCase(); }catch(e){ return ""; } })();
const messBereit = () => !!KONFIG.messUrl;
const messAktiv = () => messBereit() && fort.zaehlen === "ja" && !!fort.id;
function neueId(){
  const a = new Uint8Array(8);
  try{ crypto.getRandomValues(a); }catch(e){ for(let i = 0; i < 8; i++) a[i] = Math.floor(Math.random() * 256); }
  return Array.from(a, b => b.toString(16).padStart(2, "0")).join("");
}
function melde(e, d){
  if(!messAktiv()) return;
  const p = Object.assign({v:KONFIG.version, id:fort.id, q:fort.q || "", e:e}, d || {});
  try{
    fetch(KONFIG.messUrl, {method:"POST", mode:"no-cors", keepalive:true, headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(p)}).catch(() => {});
  }catch(err){}
}

const alleErledigt = () => HALTE.every(h => fort.erledigt[h.id]);
const anzahlErledigt = () => HALTE.filter(h => fort.erledigt[h.id]).length;
const naechsterHalt = () => { const i = HALTE.findIndex(h => !fort.erledigt[h.id]); return i < 0 ? 0 : i; };

/* ---------- Bausteine ---------- */
function quelleHTML(keys){
  if(!keys || !keys.length) return "";
  const links = keys.map(k => `<a href="${Q[k].url}" target="_blank" rel="noopener">${esc(Q[k].kurz)}</a>`).join(", ");
  return `<p class="quelle">${keys.length > 1 ? "Quellen" : "Quelle"}: ${links}</p>`;
}
function rueckHTML(ok, text, keys, kopf){
  return `<div class="rueck ${ok ? "gut" : "schlecht"}" role="status"><p class="rueck-kopf"><span class="lampe"></span>${kopf || (ok ? "Richtig." : "Nicht ganz.")}</p><p>${text}</p>${quelleHTML(keys)}</div>`;
}
function streckeHTML(){
  return `<div class="strecke" aria-hidden="true">` + HALTE.map((h,i) => `${i ? "<b></b>" : ""}<i class="${fort.erledigt[h.id] ? "voll" : ""}"></i>`).join("") + `</div>`;
}

/* ---------- Seiten ---------- */
function fahrplanHTML(){
  const n = anzahlErledigt(), nx = naechsterHalt();
  const knopf = n === 0 ? "Losfahren" : alleErledigt() ? "Noch einmal ab Halt 1" : `Weiter mit Halt ${nx + 1}`;
  const zeilen = HALTE.map((h,i) => {
    const e = fort.erledigt[h.id];

    return `<li><button class="zeile ${!alleErledigt() && i === nx ? "naechster" : ""}" data-akt="start" data-halt="${i}" aria-label="Halt ${i+1}: ${esc(h.titel)}, ${h.dauer} Minuten, ${e ? "geschafft" : "offen"}">

  }).join("");
  const tage = fort.tage > 1 ? ` Du bist ${fort.tage} Tage in Folge dabei.` : "";
  return `

    <h1>Bei KI nur Bahnhof?</h1>

      <p>Bei jeder Angabe in diesem Kurs steht, woher sie stammt. Die ganze Liste findest du unter Quellen. Begriffe zum Nachschlagen stehen im Glossar.</p>
    </section>
  </div>`;
}

/* ---------- Lektion ---------- */
function zerlege(text){
  const teile = text.match(/[A-Za-zÄÖÜäöüß]+|\d+|[^\sA-Za-zÄÖÜäöüß\d]/g) || [];
  const out = [];
  for(const t of teile){
    if(/^[A-Za-zÄÖÜäöüß]+$/.test(t) && t.length > 6){
      let i = 0;
      while(i < t.length){
        let n = 4;
        const rest = t.length - i - 4;
        if(rest > 0 && rest < 3) n = t.length - i;
        out.push(t.slice(i, i + n));
        i += n;
      }
    } else out.push(t);
  }
  return out;
}
function tokenAusgabe(text){
  const t = zerlege(text);
  const chips = t.map(x => `<span>${esc(x)}</span>`).join("");
  return `<div class="tokens">${chips || '<span class="leise">Schreib etwas in das Feld.</span>'}</div><p class="zaehler">${text.length} Zeichen, ungefähr ${t.length} Tokens</p>`;
}

function schrittHTML(st){
  const s = z.s;
  if(st.typ === "text"){
    return `<h2>${esc(st.h)}</h2>${st.html}${st.merke ? `<p class="merke">${esc(st.merke)}</p>` : ""}${quelleHTML(st.quelle)}`;
  }
  if(st.typ === "quiz"){
    const fertig = s.gewaehlt != null;
    const opts = st.optionen.map((o,i) => {
      let k = "", zeichen = "";
      if(fertig && i === st.richtig){ k = "richtig"; zeichen = "✓"; }
      else if(fertig && i === s.gewaehlt){ k = "falsch"; zeichen = "✗"; }
      return `<button class="option ${k}" data-akt="antwort" data-i="${i}" ${fertig ? "disabled" : ""}><span class="zeichen" aria-hidden="true">${zeichen}</span><span>${esc(o)}</span></button>`;
    }).join("");
    return `<h2>${esc(st.frage)}</h2><div class="optionen">${opts}</div>${fertig ? rueckHTML(s.gewaehlt === st.richtig, esc(st.warum), st.quelle) : ""}`;
  }
  if(st.typ === "sortieren"){
    const k = s.karte || 0, karte = st.karten[k], fertig = !!s.beantwortet;
    const eimer = st.eimer.map((e,i) => {
      let kl = "";
      if(fertig && i === karte.e) kl = "richtig";
      else if(fertig && i === s.gewaehlt) kl = "falsch";
      return `<button class="option ${kl}" data-akt="eimer" data-i="${i}" ${fertig ? "disabled" : ""}>${esc(e)}</button>`;
    }).join("");
    const ok = s.gewaehlt === karte.e;
    return `<h2>${esc(st.h)}</h2><p class="zaehler">Karte ${k+1} von ${st.karten.length}</p><div class="aussage">${esc(karte.t)}</div><div class="eimer">${eimer}</div>${fertig ? rueckHTML(ok, esc(karte.warum), karte.quelle, ok ? "Richtig." : `Nicht ganz. Die Antwort ist: ${esc(st.eimer[karte.e])}.`) : ""}`;
  }
  if(st.typ === "vorhersage"){
    const fertig = s.gewaehlt != null;
    const opts = st.optionen.map((o,i) => {
      let k = "", zeichen = "";
      if(fertig && i === st.richtig){ k = "richtig"; zeichen = "✓"; }
      else if(fertig && i === s.gewaehlt){ k = "falsch"; zeichen = "✗"; }
      return `<button class="option ${k}" data-akt="antwort" data-i="${i}" ${fertig ? "disabled" : ""}><span class="zeichen" aria-hidden="true">${zeichen}</span><span>${esc(o.w)}</span></button>`;
    }).join("");
    const balken = fertig ? `<div class="balken" aria-label="So wahrscheinlich wären die Wörter für ein Sprachmodell">${st.optionen.map((o,i) => `<div class="balken-zeile ${i === st.richtig ? "treffer" : ""}"><span>${esc(o.w)}</span><span class="balken-bahn"><i style="width:${Math.max(o.p,1)}%"></i></span><span>${o.p <= 1 ? "unter 1 %" : o.p + " %"}</span></div>`).join("")}</div><p class="quelle">Die Prozentwerte sind ausgedachte Beispiele, keine Messung.</p>` : "";
    return `<h2>${esc(st.h)}</h2><p>${esc(st.frage)}</p><p class="satz">${esc(st.satz)} <span class="luecke">${fertig ? esc(st.optionen[st.richtig].w) : "…"}</span></p><div class="optionen">${opts}</div>${fertig ? rueckHTML(s.gewaehlt === st.richtig, esc(st.warum)) + balken : ""}`;
  }
  if(st.typ === "tokens"){
    const text = s.text != null ? s.text : st.start;
    return `<h2>${esc(st.h)}</h2><label for="token-feld">Schreib einen Satz und sieh, in welche Stücke er ungefähr zerfällt.</label>
      <textarea class="eingabe" id="token-feld" rows="2" maxlength="160">${esc(text)}</textarea>
      <div id="token-aus" aria-live="polite">${tokenAusgabe(text)}</div>
      <p class="quelle">Vereinfachte Zerlegung zum Ausprobieren. Echte Modelle teilen Text anders, und jeder Anbieter ein wenig verschieden.</p>`;
  }
  if(st.typ === "bauen"){
    const an = s.an || [];
    const chips = st.bausteine.map((b,i) => `<button class="baustein" data-akt="baustein" data-i="${i}" aria-pressed="${an.includes(i)}">${esc(b.name)}</button>`).join("");
    const zusatz = st.bausteine.map((b,i) => an.includes(i) ? ` <mark>${esc(b.text)}</mark>` : "").join("");
    const offen = st.bausteine.filter((b,i) => !an.includes(i)).map(b => b.name);
    const stand = offen.length ? `Die KI muss noch raten: ${offen.join(", ")}.` : "Jetzt muss die KI nichts mehr raten.";
    return `<h2>${esc(st.h)}</h2><p>${esc(st.intro)}</p><div class="bausteine">${chips}</div><p class="prompt">${esc(st.basis)}${zusatz}</p><p class="${offen.length ? "zaehler" : "merke"}" role="status">${stand}</p>`;
  }
  return "";
}

function kannWeiter(st){
  if(st.typ === "quiz" || st.typ === "vorhersage") return z.s.gewaehlt != null;
  if(st.typ === "sortieren") return !!z.s.beantwortet;
  return true;
}
function weiterText(h, st){
  if(st.typ === "sortieren" && (z.s.karte || 0) < st.karten.length - 1) return "Nächste Karte";
  if(z.schritt === h.schritte.length - 1) return "Halt abschließen";
  return "Weiter";
}

function lektionHTML(){
  const h = HALTE[z.halt];
  if(z.ende) return endeHTML(h);
  const st = h.schritte[z.schritt];
  return `
  <div class="lektion">
    <div class="kopf"><button data-akt="schliessen">Zum Fahrplan</button><span>Halt ${z.halt + 1} von ${HALTE.length}</span></div>
    <div class="schritte" role="progressbar" aria-label="Fortschritt in diesem Halt" aria-valuemin="0" aria-valuemax="${h.schritte.length}" aria-valuenow="${z.schritt}">${h.schritte.map((_,i) => `<i class="${i <= z.schritt ? "war" : ""}"></i>`).join("")}</div>
    <main class="blatt" id="blatt">${schrittHTML(st)}</main>
    <div class="fuss"><button class="knopf" data-akt="weiter" ${kannWeiter(st) ? "" : "disabled"}>${weiterText(h, st)}</button></div>
  </div>`;
}

function endeHTML(h){
  const e = fort.erledigt[h.id];
  const letzter = z.halt === HALTE.length - 1;
  return `
  <div class="lektion">
    <div class="kopf"><button data-akt="schliessen">Zum Fahrplan</button><span>Halt ${z.halt + 1} von ${HALTE.length}</span></div>
    <div class="schritte">${h.schritte.map(() => `<i class="war"></i>`).join("")}</div>
    <main class="blatt">
      <h2>Halt ${z.halt + 1} geschafft</h2>
      ${z.lauf.gesamt ? `<p>Du hast ${z.lauf.richtig} von ${z.lauf.gesamt} Aufgaben richtig gelöst.${e && e.richtig > z.lauf.richtig ? ` Dein bestes Ergebnis hier: ${e.richtig}.` : ""}</p>` : ""}
      <section class="kasten"><h3>Das nimmst du mit</h3><ul>${h.mitnehmen.map(m => `<li>${esc(m)}</li>`).join("")}</ul></section>
    </main>
    <div class="fuss"><button class="knopf" data-akt="${letzter ? "schliessen" : "naechster"}">${letzter ? "Zur Fahrkarte" : `Weiter zu Halt ${z.halt + 2}`}</button></div>
  </div>`;
}

/* ---------- Ablauf ---------- */
function zeichne(oben){
  if(z.frage !== null) app.innerHTML = einwilligungHTML();
  else if(z.halt !== null) app.innerHTML = lektionHTML();
  else app.innerHTML = (z.ansicht === "glossar" ? glossarHTML() : z.ansicht === "quellen" ? quellenHTML() : z.ansicht === "datenschutz" ? datenschutzHTML() : fahrplanHTML()) + navHTML();
  if(oben) window.scrollTo(0, 0);
}
function starteHalt(i){
  if(messBereit() && fort.zaehlen == null){ z.frage = i; zeichne(true); return; }
  z.frage = null; z.halt = i; z.schritt = 0; z.s = {}; z.lauf = {richtig:0, gesamt:0}; z.ende = false; z.startzeit = Date.now();
  melde("halt_start", {h:i + 1});
  zeichne(true);
}
function setzeZaehlung(wert){
  fort.zaehlen = wert;
  if(wert === "ja"){
    if(!fort.id) fort.id = neueId();
    if(!fort.q) fort.q = QUELLE;
    if(!fort.gemeldet.start){ fort.gemeldet.start = true; melde("start"); }
  }
  sichern();
}
function werte(ok){ z.lauf.gesamt++; if(ok) z.lauf.richtig++; }
function heute(off){ const d = new Date(); d.setDate(d.getDate() + (off || 0)); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function schliesseHaltAb(){
  const h = HALTE[z.halt], alt = fort.erledigt[h.id];
  if(!alt || z.lauf.richtig >= alt.richtig) fort.erledigt[h.id] = {richtig:z.lauf.richtig, gesamt:z.lauf.gesamt};
  const t = heute();
  if(fort.letzterTag !== t){ fort.tage = fort.letzterTag === heute(-1) ? (fort.tage || 0) + 1 : 1; fort.letzterTag = t; }
  const sek = z.startzeit ? Math.min(36000, Math.round((Date.now() - z.startzeit) / 1000)) : 0;
  melde("halt_fertig", {h:z.halt + 1, r:z.lauf.richtig, g:z.lauf.gesamt, s:sek});
  if(alleErledigt() && !fort.gemeldet.kurs){
    fort.gemeldet.kurs = true;
    melde("kurs_fertig", {r:HALTE.reduce((a,x) => a + fort.erledigt[x.id].richtig, 0), g:HALTE.reduce((a,x) => a + fort.erledigt[x.id].gesamt, 0)});
  }
  sichern(); z.ende = true; zeichne(true);
}

app.addEventListener("click", ev => {
  const el = ev.target.closest("[data-akt]"); if(!el) return;
  const akt = el.dataset.akt;
  const h = z.halt !== null ? HALTE[z.halt] : null;
  const st = h && !z.ende ? h.schritte[z.schritt] : null;
  if(akt === "start"){ starteHalt(+el.dataset.halt); }
  else if(akt === "schliessen"){ z.halt = null; z.frage = null; z.ende = false; z.ansicht = "fahrplan"; zeichne(true); }
  else if(akt === "zaehlen"){
    setzeZaehlung(el.dataset.wert);
    if(z.frage !== null){ const i = z.frage; z.frage = null; starteHalt(i); } else zeichne();
  }
  else if(akt === "senden"){
    if(!fort.rueck.verst || !fort.rueck.weiter){ z.kopiert = "fehlt"; zeichne(); }
    else { melde("feedback", {verst:+fort.rueck.verst, weiter:fort.rueck.weiter, text:z.rueckText.slice(0, 400)}); z.kopiert = "gesendet"; zeichne(); }
  }
  else if(akt === "naechster"){ starteHalt(z.halt + 1); }
  else if(akt === "antwort" && st && z.s.gewaehlt == null){ z.s.gewaehlt = +el.dataset.i; werte(z.s.gewaehlt === st.richtig); zeichne(); fokusWeiter(); }
  else if(akt === "eimer" && st && !z.s.beantwortet){ z.s.gewaehlt = +el.dataset.i; z.s.beantwortet = true; werte(z.s.gewaehlt === st.karten[z.s.karte || 0].e); zeichne(); fokusWeiter(); }
  else if(akt === "baustein" && st){ const i = +el.dataset.i; const an = z.s.an || []; z.s.an = an.includes(i) ? an.filter(x => x !== i) : an.concat(i); zeichne(); const b = app.querySelector(`.baustein[data-i="${i}"]`); if(b) b.focus(); }
  else if(akt === "weiter" && st && kannWeiter(st)){
    if(st.typ === "sortieren" && (z.s.karte || 0) < st.karten.length - 1){ z.s = {karte:(z.s.karte || 0) + 1}; zeichne(true); }
    else if(z.schritt < h.schritte.length - 1){ z.schritt++; z.s = {}; zeichne(true); }
    else schliesseHaltAb();
  }
  else if(akt === "rueck"){ fort.rueck[el.dataset.feld] = el.dataset.wert; z.kopiert = ""; sichern(); zeichne(); }
  else if(akt === "kopieren"){
    const text = el.dataset.text;
    const fertig = ok => { z.kopiert = ok ? "ok" : "manuell"; zeichne(); };
    try{ navigator.clipboard.writeText(text).then(() => fertig(true), () => fertig(false)); }catch(e){ fertig(false); }
  }
  else if(akt === "zuruecksetzen"){
    if(!z.zurueck){ z.zurueck = true; zeichne(); }
    else { fort = {erledigt:{}, tage:0, letzterTag:null, rueck:{}, zaehlen:fort.zaehlen, id:fort.id, q:fort.q, gemeldet:fort.gemeldet}; sichern(); z.zurueck = false; location.hash = "fahrplan"; z.ansicht = "fahrplan"; zeichne(true); }
  }
});
function fokusWeiter(){ const r = app.querySelector(".rueck"); if(r && r.scrollIntoView) r.scrollIntoView({block:"nearest", behavior:"smooth"}); }

app.addEventListener("input", ev => {
  if(ev.target.id === "rueck-text"){ z.rueckText = ev.target.value; }
  if(ev.target.id === "token-feld"){ z.s.text = ev.target.value; const a = document.getElementById("token-aus"); if(a) a.innerHTML = tokenAusgabe(ev.target.value); }
  if(ev.target.id === "suche"){
    const q = ev.target.value.trim().toLowerCase(); let n = 0;
    app.querySelectorAll("#glossar-liste li").forEach(li => { const zeig = !q || li.dataset.b.includes(q); li.hidden = !zeig; if(zeig) n++; });
    const leer = document.getElementById("glossar-leer"); if(leer) leer.hidden = n > 0;
  }
});

function ausHash(){ const a = location.hash.replace("#",""); return ANSICHTEN.includes(a) ? a : "fahrplan"; }
window.addEventListener("hashchange", () => { z.ansicht = ausHash(); z.halt = null; z.frage = null; z.ende = false; z.zurueck = false; zeichne(true); });

function start(d){
  z.ansicht = ausHash();
  if(d && typeof d.halt === "number" && HALTE[d.halt]){ z.halt = d.halt; z.schritt = Math.min(d.schritt || 0, HALTE[d.halt].schritte.length - 1); z.lauf = d.lauf || {richtig:0, gesamt:0}; }
  zeichne();
}
if(window.claude && window.claude.hot && window.claude.hot.snapshot){
  window.claude.hot.snapshot(() => ({halt:z.ende ? null : z.halt, schritt:z.schritt, lauf:z.lauf}));
}
if(window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
</body>
</html>
